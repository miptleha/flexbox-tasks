<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Task 13</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <div class="profile">
        <div class="profile__cover">
            <img src="images/cover.png" 
                 alt="Profile Cover" 
                 class="profile__cover-image">
        </div>
        
        <div class="profile__avatar-container">
            <img src="images/avatar.png" 
                 alt="User Avatar" 
                 class="profile__avatar">
        </div>
        
        <div class="profile__content">
            <h1 class="profile__name">Alex Johnson</h1>
            <p class="profile__title">Senior Frontend Developer</p>
            <p class="profile__description">
                Passionate about creating beautiful and functional user interfaces. 
                Love working with React, Vue.js, and modern CSS. Open to new opportunities 
                and interesting projects.
            </p>
            
            <div class="profile__stats">
                <div class="profile__stat">
                    <span class="profile__stat-number">247</span>
                    <span class="profile__stat-label">Posts</span>
                </div>
                <div class="profile__stat">
                    <span class="profile__stat-number">1.2K</span>
                    <span class="profile__stat-label">Followers</span>
                </div>
                <div class="profile__stat">
                    <span class="profile__stat-number">356</span>
                    <span class="profile__stat-label">Following</span>
                </div>
            </div>
            
            <div class="profile__actions">
                <button class="profile__button profile__button--primary">Follow</button>
                <button class="profile__button profile__button--secondary">Message</button>
            </div>
        </div>
    </div>
</body>
</html>
